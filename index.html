<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123d5a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Semideuses 3e" />
  <title>Semideuses RPG 3e</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#21313c;background:#f4efe4;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}html,body{min-width:320px;min-height:100%}body{margin:0;background:#f4efe4}button{font:inherit;-webkit-tap-highlight-color:transparent}
    .app-shell{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
    .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;color:white;background:linear-gradient(145deg,#123d5a,#0d2e44);box-shadow:0 8px 24px rgba(15,45,65,.2)}
    .topbar h1{margin:2px 0 0;font-size:1.45rem}.eyebrow{display:block;color:#d8b45b;font-size:.68rem;font-weight:900;letter-spacing:.12em}
    .brand-mark{width:46px;height:46px;display:grid;place-items:center;border:2px solid #d2ad51;border-radius:50%;background:rgba(255,255,255,.08);font-weight:900}
    .content{width:min(100%,920px);margin:0 auto;padding:16px 14px 28px}
    .hero{padding:22px;border-radius:22px;color:white;background:linear-gradient(145deg,#174f78,#123d5a 62%,#0b2b40);box-shadow:0 14px 32px rgba(18,61,90,.22)}
    .hero h2{margin:7px 0 10px;font-size:clamp(1.55rem,6vw,2.35rem);line-height:1.08}.hero p{margin:0;color:#d8e3ea;line-height:1.55}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .card,.panel{border:1px solid #ddd2bc;border-radius:18px;background:#fffdf8;box-shadow:0 4px 14px rgba(44,42,36,.06)}
    .card.action{min-height:132px;display:grid;place-items:center;align-content:center;gap:5px;padding:16px 10px;color:#123d5a;cursor:pointer}.card.action:active{transform:scale(.98)}
    .card-icon{font-size:1.75rem}.card strong{font-size:1rem}.card small{color:#706b61;text-align:center}
    .panel{margin-top:12px;padding:18px}.panel h2,.panel h3{margin:8px 0;color:#123d5a}.panel p,.panel li{color:#706b61;line-height:1.5}.panel ul{padding-left:20px;margin-bottom:0}
    .status{display:inline-flex;padding:6px 9px;border-radius:999px;color:#805f12;background:#f4e7bd;font-size:.72rem;font-weight:800}
    .empty{min-height:360px;display:grid;place-content:center;justify-items:center;text-align:center}.large-icon{font-size:3rem;color:#b78d2f}
    .primary{border:0;border-radius:12px;padding:12px 16px;color:white;background:#123d5a;font-weight:800}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));border-top:1px solid #ded4c2;background:rgba(255,253,248,.95);backdrop-filter:blur(16px)}
    .bottom-nav button{display:grid;justify-items:center;gap:3px;padding:8px 4px;border:0;border-radius:12px;color:#817a6d;background:transparent}.bottom-nav button span{font-size:1.15rem}.bottom-nav button small{font-size:.67rem}.bottom-nav button.active{color:white;background:#123d5a}
    @media(max-width:560px){.grid{grid-template-columns:1fr}.card.action{min-height:94px;grid-template-columns:auto 1fr;justify-items:start;text-align:left;padding:14px 18px}.card.action .card-icon{grid-row:span 2}.card.action small{text-align:left}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (function(){
      var sections=[
        {id:'inicio',label:'Início',icon:'⌂'},
        {id:'jogador',label:'Jogador',icon:'♙'},
        {id:'mestre',label:'Mestre',icon:'⚑'},
        {id:'compendio',label:'Compêndio',icon:'☷'}
      ];
      var current='inicio';
      var app=document.getElementById('app');

      function escapeHtml(value){return String(value).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
      function getSection(){return sections.find(function(item){return item.id===current})||sections[0]}
      function render(){
        var active=getSection();
        var content=current==='inicio'?
          '<section class="hero"><span class="eyebrow">BASE NOVA · DEVELOP</span><h2>Fundação leve e estável para todos os aparelhos.</h2><p>Esta versão usa JavaScript direto no navegador, sem dependências e sem etapa de compilação. Serve para validar Android, iPhone e computador antes dos módulos do RPG.</p></section>'+
          '<section class="grid">'+sections.slice(1).map(function(item){return '<button class="card action" data-go="'+item.id+'"><span class="card-icon">'+item.icon+'</span><strong>'+escapeHtml(item.label)+'</strong><small>Módulo preparado</small></button>'}).join('')+'</section>'+
          '<section class="panel"><span class="status">Sprint 0</span><h3>Teste de fundação</h3><ul><li>JavaScript leve, sem framework</li><li>Layout responsivo</li><li>Navegação instantânea</li><li>Compatível com Android, iPhone e computador</li></ul></section>'
          :'<section class="panel empty"><span class="large-icon">'+active.icon+'</span><h2>Módulo '+escapeHtml(active.label)+'</h2><p>A navegação está funcionando. O conteúdo será incluído somente após esta base ser validada.</p><button class="primary" data-go="inicio">Voltar ao início</button></section>';

        app.innerHTML='<div class="app-shell"><header class="topbar"><div><span class="eyebrow">SEMIDEUSES RPG 3E</span><h1>'+escapeHtml(active.label)+'</h1></div><div class="brand-mark">S3</div></header><main class="content">'+content+'</main><nav class="bottom-nav" aria-label="Navegação principal">'+sections.map(function(item){return '<button data-go="'+item.id+'" class="'+(current===item.id?'active':'')+'"><span>'+item.icon+'</span><small>'+escapeHtml(item.label)+'</small></button>'}).join('')+'</nav></div>';

        Array.prototype.forEach.call(document.querySelectorAll('[data-go]'),function(button){button.addEventListener('click',function(){current=button.getAttribute('data-go');render();window.scrollTo(0,0)})});
      }
      try{render()}catch(error){app.innerHTML='<main style="padding:24px;font-family:system-ui"><h1>Falha ao iniciar</h1><pre style="white-space:pre-wrap">'+escapeHtml(error&&error.message?error.message:error)+'</pre></main>'}
    })();
  </script>
</body>
</html>
